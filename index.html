<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Músicas - Music Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">

    <header class="text-sm text-gray-400">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold text-indigo-400 tracking-wide">
                Music Explorer
            </h1>
            <p class="text-sm text-gray-400"> Consulte e explore informações sobre músicas</p>
        </div>
    </header>
    

    <main class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6 space-y-6">

        <section class="bg-gray-800  p-4 md:p-6 rounded-lg shadow-lg" aria-label="Filtros e Pesquisa">
            <form id="search-form" class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">

                <div class="md:col-span-6 flex flex-col">
                    <label for="search-input" class="text-sm font-medium mb-1 text-gray-300">
                        Pesquisar por título ou artista:
                    </label>
                    <input 
                    type="text"
                    id="search-input"
                    placeholder="Ex: Queen, Bohemian Rhapsody..."
                    required
                    class="px-4 py-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white placeholder-gray-400"
                 >
                </div>

                <div class="md:col-span-4 flex flex-col">
                    <label for="sort-select" class="text-sm font-medium mb-1 text-gray-300">
                        Ordenar resultados por:
                    </label>
                    <select
                     id="sort-select"
                     class="px-4 py-2 bg-gray-700 border border-gray-600 rounded-mb focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white"
                    >
                     <option value="default">Padrão de busca</option>
                     <option value="title">Título (A-Z)</option>
                     <option value="artist">Artista (A-Z)</option>
                     <option value="date">Data de Lançamento (Mais recentes)</option>
                    </select>
                </div>

                <div class="md:col-span-2">
                    <button
                    type="submit"
                    id="w-full bg-indigo-600 hover:bg-indigo-700 text-white font--semibold py-2 px-4 rounded-md transition duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-400"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-md transition duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-400"
                    >
                        Buscar
                    </button>
                </div>  
            </form>
        </section>

        <section aria-live="polite" class="text-center">
            <div id="status-message" class="hidden text-lg font-medium p-4 rounded-md"></div>
        </section>

        <section aria-label="Resultados da Pesquisa">
            <div id="results-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
        </section>
    </main>

    <div
    id="detail-modal"
    class="fixed inset-0 bg-black/75 hidden backdrop-blur-sm flex items-center justify-center p-4 z-50"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    >
        <div class="bg-gray-800 rounded-lg max-w-lg w-full p-6 relative border border-gray-700 shadow-2xl space-y-4">
          <button
            id="close-modal"
            class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500 rounded p-1"
            aria-label="Fechar modal"
          >
              &times;
            </button>
            <div id="modal-content" class="space-y-4">

            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
